name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Stage
        id: stage
        shell: pwsh
        run: |
          $pkg = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0]
          New-Item -ItemType Directory -Force "dist/$($pkg.name)"
          Copy-Item "target/release/$($pkg.name).exe" "dist/$($pkg.name)/"
          "artifact=$($pkg.name)-$($pkg.version)-windows-x64" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: dist
