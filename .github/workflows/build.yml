name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.stage.outputs.artifact }}
      name: ${{ steps.stage.outputs.name }}
      tag: ${{ steps.stage.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The app replaces its copy of a data file only when its time here is newer.
      - name: Manifest
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE -match '^0+$') { "No earlier commit to compare"; exit 0 }
          git fetch --no-tags --depth=1 origin $env:BASE
          $old = git show "${env:BASE}:assets/manifest.json" | ConvertFrom-Json -AsHashtable
          if (-not $old) { "No manifest before this push"; exit 0 }
          $new = Get-Content assets/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          $stale = git diff --name-only $env:BASE HEAD -- assets/service assets/client |
            Where-Object { $name = $_ -replace '^assets/', ''; -not ($new[$name] -gt $old[$name]) }
          if ($stale) { throw "Changed without a newer time in assets/manifest.json: $($stale -join ', ')" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Npcap SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/npcap-sdk.zip"
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB") { throw "Npcap SDK hash mismatch: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP/npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
          "LIBPCAP_VER=1.10.6" >> $env:GITHUB_ENV

      - run: cargo fmt --check

      - run: cargo clippy --release --all-targets --locked -- -D warnings

      - run: cargo build --release --locked

      - name: Stage
        id: stage
        shell: pwsh
        run: |
          $pkg = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0]
          $artifact = "$($pkg.name)-$($pkg.version)-windows-x64"
          New-Item -ItemType Directory -Force "dist/$($pkg.name)"
          Copy-Item "target/release/$($pkg.name).exe" "dist/$($pkg.name)/"
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          "name=$($pkg.name)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      # Without Npcap the exe must still start, so wpcap.dll has to be delay loaded.
      - name: Delay Load
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = (& $dumpbin /nologo /imports "dist/${{ steps.stage.outputs.name }}/${{ steps.stage.outputs.name }}.exe") -join "`n"
          $at = $imports.IndexOf("delay load imports")
          if ($at -lt 0 -or $imports.Substring(0, $at) -match "wpcap\.dll" -or $imports.Substring($at) -notmatch "wpcap\.dll") {
            throw "wpcap.dll is not a delay load import only"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: dist

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.artifact }}.zip
        run: |
          git rev-parse -q --verify "refs/tags/$env:TAG" | Out-Null
          if ($LASTEXITCODE -eq 0) { "$env:TAG is already released"; exit 0 }
          Compress-Archive "dist/${{ needs.build.outputs.name }}" $env:ZIP
          $prev = git tag --list 'v*' --merged HEAD --sort=-v:refname | Select-Object -First 1
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          git log $range --no-merges --pretty="- %s ([%h]($repo/commit/%H))" > notes.md
          if ($prev) { "`n**Full Changelog**: $repo/compare/$prev...$env:TAG" >> notes.md }
          gh release create $env:TAG $env:ZIP --target $env:GITHUB_SHA --title $env:TAG --notes-file notes.md
