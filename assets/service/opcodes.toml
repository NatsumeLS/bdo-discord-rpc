# What the packet capture decodes, one table per client build, the first u32
# of Paz/pad00000.meta. Every region on a build shares its table. Opcodes and
# offsets move with patches: run --capture with a dump file, search it for a
# known character ID or name to find them again, and add a table for the new
# build. A build with no table uses the newest one. Offsets count from the
# start of the frame, header included. Positions are x, height, z as f32.
# Bump this file's time in manifest.json with every change, or the app keeps
# its copy.
#
# list: one message per character at character select.
# enter: the character entering the world, matched by enter_length, its full
# frame length, since other lengths are other bundles.
# enter_id: u64, the same number as the UserCache folder.
# enter_name, enter_family: UTF-16, up to 16 characters.
# enter_position: where the character entered.
# position: own position while moving, at position_at.

