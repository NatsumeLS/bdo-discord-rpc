# One table per service, named after the TYPE the game writes in service.ini.
# name: how the region is shown. search: the Adventurer Profile search, with
# {family} where the family name goes. servers: names as the game lists them.
# The keys after those are what the packet capture decodes, all or none: a
# region missing any of them uses the game files instead.
[ASIA]
name = "Asia"
search = "https://blackdesert.pearlabyss.com/Asia/en-US/Game/Profile/Search?_type=2&_keyword={family}"
servers = [
    "Season-1 (TH)",
    "Season-2 (TH)",
    "Season-1 (SEA)",
    "Season-2 (SEA)",
    "New Olvia (TH)",
    "New Olvia (SEA)",
    "Odyllita-1",
    "Arsha",
    "Arsha: Anonymous",
    "Velia-1 (TH)",
    "Velia-2 (TH)",
    "Velia-1 (SEA)",
    "Velia-2 (SEA)",
    "Heidel-1 (TH)",
    "Heidel-2 (TH)",
    "Heidel-1 (SEA)",
    "Heidel-2 (SEA)",
    "Altinova-1 (TH)",
    "Altinova-2 (TH)",
    "Altinova-1 (SEA)",
    "Altinova-2 (SEA)",
    "Grana-1 (TH)",
    "Grana-1 (SEA)",
    "Calpheon",
    "Balenos",
    "Serendia",
    "Mediah",
    "Valencia",
    "Ulukita",
    "Rulupee-1",
    "Rulupee-2",
    "Kamasylvia",
    "Edania",
]

# Packet capture, read from client version 1271 on 2026-10-06. Opcodes and
# offsets move with patches: run --capture with a dump file, search it for a
# known character ID or name to find them again, then bump version. Offsets
# count from the start of the frame, header included. Positions are x,
# height, z as f32.
version = 1271              # The client build, the first u32 of Paz/pad00000.meta
world_port = 8889           # The world server, character select and play
list = 0x0EE4               # One per character at character select
enter = 0x0E98              # The character entering the world, matched by length
enter_length = 8065         # Its full frame length, other lengths are other bundles
enter_id = 83               # u64, the same number as the UserCache folder
enter_name = 3970           # UTF-16, up to 16 characters
enter_family = 4043         # UTF-16, up to 16 characters
enter_position = 241        # Where the character entered
position = 0x1AFC           # Own position while moving
position_at = 6             # Its position
server_hosts = "game{nn}"   # Looked up under the domain the log names
server_count = 99           # Hosts tried, from 01 up
