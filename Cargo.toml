[package]
name = "bdo-discord-rpc"
version = "0.2.0"
edition = "2021"
description = "Discord Rich Presence for Black Desert, driven by the files the client already writes"
license = "MIT"
authors = ["NatsumeLS"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
discord-rich-presence = "1.1"
scraper = "0.27"
serde_json = "1"
ureq = "3"
tray-icon = "0.26"
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "thread-pool",
    "image-without-codecs",
    "advanced",
] }
material-color-rs = "0.1"
png = "0.18"
rust-i18n = "4"
pcap = "2.5"
toml_edit = "0.25"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
]

[build-dependencies]
serde_json = "1"
winresource = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
